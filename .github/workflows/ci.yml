# The quality gate from .claude/skills/verify/SKILL.md, run on every push and
# pull request. The five steps and their order are the same; keep them in sync.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned so that a new stable release, and the clippy lints it brings, cannot
  # fail `-D warnings` on an unrelated commit. Bump policy: when local stable
  # moves past this version, bump it in a commit of its own (`ci: bump the
  # toolchain to X.Y.Z`) that also fixes whatever the new clippy flags; never
  # fold a bump into a feature or fix. The let-chains need at least 1.88.
  RUST_TOOLCHAIN: 1.98.1
  # Same version as pages.yml; keep the two in step.
  MDBOOK_VERSION: 0.5.4

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      # Installed the same way as in pages.yml: a pinned release binary rather
      # than `cargo install`, which would compile mdBook on every run.
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      # Every step below runs even after an earlier one fails, so a single run
      # reports everything that is broken rather than only the first thing.
      - name: cargo fmt --check
        if: ${{ !cancelled() }}
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test

      - name: symref spike
        if: ${{ !cancelled() }}
        run: sh scripts/spike-symref.sh

      - name: docs site
        if: ${{ !cancelled() }}
        run: sh scripts/book.sh
