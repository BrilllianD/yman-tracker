[package]
name = "yman-tracker"
version = "0.4.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "yman"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
