[package]
name = "yman-tracker"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Git-native task tracker: tasks live in a ref outside refs/heads, travel through the project's own remote, never show up in git branch"
repository = "https://github.com/BrilllianD/yman-tracker"
homepage = "https://brillliand.github.io/yman-tracker/"
documentation = "https://brillliand.github.io/yman-tracker/"
readme = "README.md"
keywords = ["git", "task", "tracker", "todo", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".claude/", ".idea/", ".yman/", "book.toml", "CLAUDE.md", "skills/yman/evals/"]

[[bin]]
name = "yman"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
